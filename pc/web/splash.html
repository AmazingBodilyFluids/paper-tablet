<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper Tablet</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --bg:#060e17; --s1:#0a1520; --accent:#C4A882; --accent2:#4A9EE0; --dim:rgba(255,255,255,0.5); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); overflow:hidden; user-select:none; cursor:default; }
  body { display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Sans",sans-serif;
         box-shadow:inset 0 0 0 1.5px rgba(196,168,130,0.45); }
  .stage { position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  svg { width:250px; height:150px; overflow:visible; }
  .frame { fill:none; stroke:var(--accent); stroke-width:1.5; stroke-dasharray:760; stroke-dashoffset:760;
           animation: draw 0.9s cubic-bezier(.6,0,.2,1) 0.15s forwards; }
  .screen { fill:rgba(196,168,130,0.05); stroke:rgba(196,168,130,0.25); stroke-width:1; opacity:0;
            animation: fade 0.5s ease 0.8s forwards; }
  .ink { fill:none; stroke:#e8e2d6; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;
         stroke-dasharray:520; stroke-dashoffset:520; animation: draw 1.1s cubic-bezier(.45,0,.25,1) 1.05s forwards,
         trail 0.9s ease 2.35s forwards; }
  .pen { opacity:0; animation: fade 0.25s ease 0.95s forwards, travel 1.1s cubic-bezier(.45,0,.25,1) 1.05s forwards; offset-path: path("M58 96 C 82 52, 104 52, 118 80 S 152 116, 168 72 S 196 44, 204 66"); offset-rotate:0deg; }
  .word { font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:20px; letter-spacing:0.52em; color:var(--accent);
          text-indent:0.52em; opacity:0; transform:translateY(6px); animation: rise 0.6s ease 1.55s forwards; }
  .sub { font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--dim); opacity:0;
         animation: fade 0.6s ease 1.85s forwards; font-family:"IBM Plex Mono",monospace; }
  .bar { position:absolute; left:0; bottom:0; height:2px; width:0; background:linear-gradient(90deg, transparent, var(--accent2));
         animation: load 2.4s cubic-bezier(.3,0,.2,1) 0.1s forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes fade { to { opacity:1; } }
  @keyframes trail { to { opacity:0.18; } }
  @keyframes rise { to { opacity:1; transform:none; } }
  @keyframes travel { from { offset-distance:0%; } to { offset-distance:100%; } }
  @keyframes load { to { width:100%; } }
  /* exit: the app calls fadeOut() once the animation has finished and the main window is ready */
  .stage { transition: opacity .38s ease, transform .38s ease; }
  body.out .stage { opacity:0; transform: scale(.985); }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 250 150" aria-hidden="true">
    <!-- the tablet, landscape, as it sits on the desk -->
    <rect class="frame" x="18" y="12" width="214" height="126" rx="9"/>
    <rect class="screen" x="34" y="24" width="182" height="102" rx="2"/>
    <path class="ink" d="M58 96 C 82 52, 104 52, 118 80 S 152 116, 168 72 S 196 44, 204 66"/>
    <g class="pen"><circle r="3.4" fill="#4A9EE0"/><circle r="8" fill="none" stroke="#4A9EE0" stroke-opacity="0.35"/></g>
  </svg>
  <div class="word">PAPER TABLET</div>
  <div class="sub">for reMarkable Paper Pro</div>
  <div class="bar"></div>
</div>
<script>
  // Tell the app when every animation has played to the end, so it never cuts the splash off.
  window.splashDone = false;
  window.addEventListener("load", () => {
    const all = document.getAnimations ? document.getAnimations() : [];
    Promise.all(all.map(a => a.finished)).then(() => { window.splashDone = true; });
    setTimeout(() => { window.splashDone = true; }, 4000);  // never wait longer than this
  });
  function fadeOut() { document.body.classList.add("out"); }
</script>
</body>
</html>
