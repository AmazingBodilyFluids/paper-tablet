<!doctype html>
<html><head><meta charset="utf-8"><title>Pen test</title>
<style>
 body{margin:0;font:14px/1.4 Consolas,monospace;background:#fafaf8;color:#222}
 #info{position:fixed;top:8px;left:8px;background:#fff;border:1px solid #ccc;padding:8px 12px;white-space:pre}
 canvas{display:block;touch-action:none}
</style></head>
<body>
<div id="info">Draw here with the tablet pen.</div>
<canvas id="c"></canvas>
<script>
// What Windows delivers to apps: pointerType must be "pen" for pressure/tilt to exist at all.
const c = document.getElementById('c'), ctx = c.getContext('2d'), info = document.getElementById('info');
function size(){ c.width = innerWidth; c.height = innerHeight; }
size(); addEventListener('resize', size);
let last = null, maxP = 0, minTx = 0, maxTx = 0, minTy = 0, maxTy = 0, n = 0, types = {};
function show(e, kind){
  types[e.pointerType] = (types[e.pointerType] || 0) + 1;
  if (e.pressure > maxP) maxP = e.pressure;
  minTx = Math.min(minTx, e.tiltX); maxTx = Math.max(maxTx, e.tiltX);
  minTy = Math.min(minTy, e.tiltY); maxTy = Math.max(maxTy, e.tiltY);
  info.textContent =
    `event      ${kind}\npointerType ${e.pointerType}   (counts: ${JSON.stringify(types)})\n` +
    `pressure   ${e.pressure.toFixed(3)}   max seen ${maxP.toFixed(3)}\n` +
    `tiltX/Y    ${e.tiltX} / ${e.tiltY}   range X ${minTx}..${maxTx}  Y ${minTy}..${maxTy}\n` +
    `buttons    ${e.buttons}  (32 = eraser)\nposition   ${e.clientX.toFixed(0)}, ${e.clientY.toFixed(0)}`;
}
c.addEventListener('pointerdown', e => { last = e; show(e, 'down'); c.setPointerCapture(e.pointerId); });
c.addEventListener('pointermove', e => {
  show(e, e.buttons ? 'drag' : 'hover');
  if (e.buttons && last) {
    ctx.strokeStyle = e.buttons & 32 ? '#c00' : '#111';
    ctx.lineWidth = 1 + 12 * e.pressure; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(last.clientX, last.clientY); ctx.lineTo(e.clientX, e.clientY); ctx.stroke();
  }
  last = e;
});
c.addEventListener('pointerup', e => { last = null; show(e, 'up'); });
</script></body></html>
